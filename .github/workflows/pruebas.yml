name: Verificar simulador de CPU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Comprobar cálculos de los algoritmos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis del simulador
        run: |
          node --check scheduler.js
          node --check app.js
          node --check server.cjs
      - name: Ejecutar pruebas automáticas
        run: npm test