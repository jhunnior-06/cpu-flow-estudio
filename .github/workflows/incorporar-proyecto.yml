name: Incorporar simulador de CPU
on:
  push:
    paths:
      - 'paquete.parte06'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Extraer y publicar proyecto
        shell: bash
        run: |
          set -euo pipefail
          cat paquete.parte0{1..6} | base64 --decode > /tmp/cpu-flow-estudio.tar.xz
          echo 'c50c958aacf490991712225a19e801ea857a457dcbbd6bde5699a5182b4d7ebe  /tmp/cpu-flow-estudio.tar.xz' | sha256sum -c -
          tar -xJf /tmp/cpu-flow-estudio.tar.xz -C /tmp
          cp -a /tmp/cpu-flow-estudio/. ./
          rm -f paquete.parte0{1..6} .github/workflows/incorporar-proyecto.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Agregar simulador interactivo de planificación de CPU'
          git push origin HEAD:main
