name: Incorporar aplicación de planificación de CPU
on:
  push:
    paths:
      - 'payload04.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  incorporar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Restaurar archivos del simulador
        shell: bash
        run: |
          set -euo pipefail
          cat payload0{1,2,3,4}.txt | base64 --decode > /tmp/cpu-flow.br
          node -e "const fs=require('fs'),z=require('zlib'),p=JSON.parse(z.brotliDecompressSync(fs.readFileSync('/tmp/cpu-flow.br')).toString('utf8'));for(const [name,content] of Object.entries(p)){fs.mkdirSync(require('path').dirname(name),{recursive:true});fs.writeFileSync(name,content)}"
          rm -f payload0{1,2,3,4}.txt .github/workflows/incorporar-proyecto.yml
          node --test test/scheduler.test.cjs
      - name: Publicar archivos del proyecto
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Incorporar simulador de CPU y corregir archivos faltantes'
          git push origin HEAD:main
