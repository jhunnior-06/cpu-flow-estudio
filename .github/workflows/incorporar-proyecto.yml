name: Incorporar simulador de CPU
on:
  push:
    paths:
      - 'cpu-flow-estudio-listo-github.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Extraer proyecto
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o cpu-flow-estudio-listo-github.zip
          cp -a cpu-flow-estudio/. ./
          rm -rf cpu-flow-estudio cpu-flow-estudio-listo-github.zip
          rm -f .github/workflows/incorporar-proyecto.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Agregar simulador interactivo de planificación de CPU'
          git push origin HEAD:main
